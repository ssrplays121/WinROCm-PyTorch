name: ROCm Release URL Check

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-urls:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate URLs in releases.psd1
        shell: pwsh
        run: |
          $config = Import-PowerShellDataFile -Path .\config\releases.psd1
          $urls = @(
              $config.PythonZipUrl,
              $config.PythonDevMsiUrl,
              $config.GetPipUrl
          )

          foreach ($relKey in $config.Releases.Keys) {
              $rel = $config.Releases[$relKey]
              $base = $rel.BaseUrl
              foreach ($f in $rel.SdkFiles) {
                  $urls += "$base/$f"
              }
              $urls += "$base/$($rel.Torch)"
              $urls += "$base/$($rel.Vision)"
              $urls += "$base/$($rel.Audio)"
          }

          $urls = $urls | Select-Object -Unique
          Write-Host "Verifying $($urls.Count) URLs across all releases..." -ForegroundColor Cyan

          $failed = @()
          foreach ($u in $urls) {
              try {
                  $resp = Invoke-WebRequest -Uri $u -Method Head -TimeoutSec 15 -ErrorAction Stop
                  Write-Host "  [OK $($resp.StatusCode)] $u" -ForegroundColor Green
              } catch {
                  try {
                      # Fallback to ranged GET (first 1024 bytes) if HEAD fails
                      $resp = Invoke-WebRequest -Uri $u -Headers @{ Range = "bytes=0-1023" } -TimeoutSec 15 -ErrorAction Stop
                      Write-Host "  [OK $($resp.StatusCode) (GET fallback)] $u" -ForegroundColor Green
                  } catch {
                      Write-Host "  [FAILED] $u ($($_.Exception.Message))" -ForegroundColor Red
                      $failed += $u
                  }
              }
          }

          if ($failed.Count -gt 0) {
              Write-Error "The following $($failed.Count) URL(s) failed reachability check:`n$($failed -join "`n")"
              exit 1
          }

          Write-Host "`nAll release URLs are verified and reachable." -ForegroundColor Green

      - name: Verify dynamic checksums and auto-sync
        id: verify-checksums
        shell: pwsh
        run: |
          $config = Import-PowerShellDataFile -Path .\config\releases.psd1
          $tempFile = [System.IO.Path]::GetTempFileName()
          try {
              Invoke-WebRequest -Uri $config.GetPipUrl -OutFile $tempFile -UseBasicParsing
              $actualSha = (Get-FileHash -Path $tempFile -Algorithm SHA256).Hash
              if ($actualSha -eq $config.GetPipSha256) {
                  Write-Host "get-pip.py SHA256 verified successfully against releases.psd1 ($actualSha)." -ForegroundColor Green
              } else {
                  Write-Host "Upstream get-pip.py updated. Expected: $($config.GetPipSha256), Actual: $actualSha" -ForegroundColor Yellow
                  Write-Host "Querying PyPI for corresponding pip version..." -ForegroundColor Cyan
                  $pypi = Invoke-RestMethod -Uri "https://pypi.org/pypi/pip/json"
                  $pipVer = [string]$pypi.info.version
                  Write-Host "Detected pip version: $pipVer"

                  $cfgPath = ".\config\releases.psd1"
                  $cfgContent = Get-Content -Path $cfgPath -Raw
                  $cfgContent = $cfgContent -replace "GetPipSha256\s*=\s*['`"][^'`"]+['`"]", "GetPipSha256      = '$actualSha'"
                  $cfgContent = $cfgContent -replace "PipVersion\s*=\s*['`"][^'`"]+['`"]", "PipVersion        = '$pipVer'"
                  Set-Content -Path $cfgPath -Value $cfgContent -Encoding ASCII
                  Write-Host "Updated config/releases.psd1 with GetPipSha256=$actualSha and PipVersion=$pipVer." -ForegroundColor Green

                  if ($env:GITHUB_OUTPUT) {
                      "updated=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                      "pip_version=$pipVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  }
              }
          } finally {
              Remove-Item -Path $tempFile -Force -ErrorAction SilentlyContinue
          }

      - name: Commit and push updated checksums
        if: steps.verify-checksums.outputs.updated == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/releases.psd1
          git commit -m "ci(deps): auto-sync get-pip.py SHA256 and PipVersion to ${{ steps.verify-checksums.outputs.pip_version }} [skip ci]"
          git push

