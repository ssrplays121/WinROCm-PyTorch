name: Release & Package Workflow

on:
  push:
    branches: [ main ]
    paths:
      - 'setup.bat'
      - 'setup_rocm_portable.ps1'
      - 'config/releases.psd1'
      - 'scripts/**'
      - 'templates/**'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      force_new_release:
        description: 'Force creation of a new release tag even if releases.psd1 did not change'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Version and Determine Release Tier
        id: release_info
        shell: pwsh
        run: |
          # 1. Read Project Version from setup_rocm_portable.ps1
          $setupContent = Get-Content setup_rocm_portable.ps1 -Raw
          if ($setupContent -match '\$Script:Version\s*=\s*"([^"]+)"') {
              $toolVersion = $matches[1]
          } else {
              $toolVersion = "0.5.2"
          }
          
          # 2. Read Default ROCm Release from config/releases.psd1
          $config = Import-PowerShellDataFile -Path config/releases.psd1
          $rocmVersion = $config.DefaultRelease
          
          Write-Host "Project Tool Version: $toolVersion"
          Write-Host "ROCm Default Version: $rocmVersion"
          
          # 3. Detect if config/releases.psd1 changed compared to previous commit
          $catalogChanged = $false
          $diff = git diff HEAD~1 HEAD --name-only
          if ($diff -contains "config/releases.psd1" -or "${{ github.event.inputs.force_new_release }}" -eq "true") {
              $catalogChanged = $true
          }
          
          "TOOL_VERSION=$toolVersion" >> $env:GITHUB_OUTPUT
          "ROCM_VERSION=$rocmVersion" >> $env:GITHUB_OUTPUT
          "TAG_NAME=v$toolVersion" >> $env:GITHUB_OUTPUT
          "CATALOG_CHANGED=$catalogChanged" >> $env:GITHUB_OUTPUT

      - name: Package Essential Files into Versioned Release ZIP
        id: package_step
        shell: pwsh
        run: |
          $ver = "${{ steps.release_info.outputs.TOOL_VERSION }}"
          $zipName = "WinROCm-PyTorch-v$ver.zip"
          $staging = Join-Path $env:RUNNER_TEMP "staging\WinROCm-PyTorch"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          
          New-Item -ItemType Directory -Path "$staging\config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging\scripts" -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging\templates" -Force | Out-Null
          
          # Copy essential 23 files maintaining clean directory structure
          Copy-Item "setup.bat", "setup_rocm_portable.ps1", "README.md", "LICENSE" -Destination "$staging\"
          Copy-Item "config\releases.psd1" -Destination "$staging\config\"
          Copy-Item "scripts\portable-msvc.py", "scripts\update.ps1", "scripts\status.ps1", "scripts\add_to_path.ps1", "scripts\remove_from_path.ps1" -Destination "$staging\scripts\"
          Copy-Item "templates\*" -Destination "$staging\templates\"
          
          # Create Versioned ZIP archive
          $zipOutput = Join-Path (Get-Location) $zipName
          if (Test-Path $zipOutput) { Remove-Item $zipOutput -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath $zipOutput -Force
          
          # Generate SHA-256 Checksum
          $hash = (Get-FileHash -Path $zipOutput -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath "checksums.txt" -Encoding ascii
          
          Write-Host "Package created: $zipName ($((Get-Item $zipOutput).Length) bytes)"
          Write-Host "SHA256: $hash"
          "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_info.outputs.TAG_NAME }}
          TOOL_VER: ${{ steps.release_info.outputs.TOOL_VERSION }}
          ROCM_VER: ${{ steps.release_info.outputs.ROCM_VERSION }}
          CATALOG_CHANGED: ${{ steps.release_info.outputs.CATALOG_CHANGED }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          $tagName = $env:TAG_NAME
          $zipName = $env:ZIP_NAME
          $toolVer = $env:TOOL_VER
          $rocmVer = $env:ROCM_VER
          $catalogChanged = ($env:CATALOG_CHANGED -eq "True" -or $env:CATALOG_CHANGED -eq "true")
          $title = "WinROCm-PyTorch $tagName (ROCm $rocmVer)"
          
          # Check whether the release tag already exists on GitHub
          & gh release view $tagName 2>&1 | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          
          if (-not $releaseExists -or $catalogChanged) {
              Write-Host "Creating new GitHub Release: $tagName..." -ForegroundColor Cyan
              gh release create $tagName $zipName checksums.txt `
                  --title "$title" `
                  --notes "### WinROCm-PyTorch $tagName`n`n- Pinned AMD ROCm Default Release: **$rocmVer**`n- Verified SHA-256 Checksums in \`checksums.txt\` file.`n- Quick Start: Download and extract \`$zipName\` to \`C:\rocm\`, then run \`setup.bat install\`." `
                  --latest
          } else {
              Write-Host "Switching out release assets on existing release $tagName (Patch Update)..." -ForegroundColor Yellow
              gh release upload $tagName $zipName checksums.txt --clobber
              
              # Append patch notice to release notes
              $patchDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm UTC")
              $commitSha = if ($env:GITHUB_SHA) { $env:GITHUB_SHA.Substring(0, 7) } else { "patch" }
              $patchNote = "`n`n> [!NOTE]`n> **Patch Updated**: Asset \`$zipName\` refreshed with commit \`$commitSha\` at $patchDate."
              $currentNotes = gh release view $tagName --json body -q .body
              $tempNotesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
              Set-Content -Path $tempNotesFile -Value "$currentNotes$patchNote" -Encoding utf8
              gh release edit $tagName --notes-file $tempNotesFile
              Remove-Item -Path $tempNotesFile -Force -ErrorAction SilentlyContinue
          }
